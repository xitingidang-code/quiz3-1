<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국어 3과 단어 퀴즈 · 你哪儿不舒服?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#CDE9FB; --sky2:#EFF8FF;
    --ink:#16324F; --muted:#5B7089;
    --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#E3EEFF;
    --pink:#F472B6; --pink-d:#DB2777; --pink-l:#FFE4F1;
    --green:#16A36A; --green-l:#DCF5E8;
    --yellow:#FFD166; --yellow-l:#FFF4D1;
    --red:#E5484D; --red-l:#FFE3E3;
    --paper:#FFFFFF; --line:#D5E5F3;
    --shadow:0 10px 26px rgba(37,99,235,.13);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,#fff 100%);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 14px 56px;
  }
  .wrap{width:100%;max-width:980px;}
  .hero{text-align:center;margin-bottom:10px;}
  .hero svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;}
  .eyebrow{font-family:'Jua',sans-serif;font-size:15px;color:var(--pink-d);letter-spacing:.08em;margin-top:2px;}
  h1{font-family:'Jua','Noto Sans SC',sans-serif;font-size:clamp(34px,7vw,56px);margin:2px 0 0;color:var(--blue);
     text-shadow:3px 3px 0 var(--pink-l);letter-spacing:1px;}
  .pinyin-title{font-family:'Jua',sans-serif;font-size:18px;color:var(--muted);margin-top:-2px;}
  .subtitle{font-size:14px;color:var(--muted);margin-top:6px;}
  .ecg{width:100%;max-width:520px;height:34px;display:block;margin:6px auto 0;}
  .ecg path{stroke-dasharray:420;stroke-dashoffset:420;animation:ecg 3.2s ease-in-out infinite;}
  @keyframes ecg{0%{stroke-dashoffset:420}60%,100%{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dashoffset:0}}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 20px;}
  .tab-btn{font-family:'Jua',sans-serif;font-size:17px;background:#fff;color:var(--blue);
    border:2px solid var(--blue-l);padding:8px 18px;border-radius:999px;cursor:pointer;transition:.15s;}
  .tab-btn:hover{border-color:var(--blue);}
  .tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .hidden{display:none !important;}

  .panel{background:var(--paper);border-radius:20px;padding:26px 24px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;}
  .panel.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:8px;border-radius:0 0 8px 8px;
    background:repeating-linear-gradient(90deg,var(--pink) 0 14px,#fff 14px 20px);}
  .panel h2{font-family:'Jua',sans-serif;font-weight:400;font-size:23px;margin:4px 0 12px;color:var(--ink);}
  .muted{color:var(--muted);font-size:13px;line-height:1.55;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .field-label{font-family:'Jua',sans-serif;font-size:14px;color:var(--blue);margin-bottom:4px;}
  select,input[type=text],input[type=password]{font-family:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:2px solid var(--line);outline:none;background:#fff;color:var(--ink);}
  select:focus,input:focus{border-color:var(--blue);}
  .btn{font-family:'Jua',sans-serif;font-size:16px;background:var(--ink);color:#fff;border:none;padding:10px 20px;border-radius:999px;cursor:pointer;}
  .btn.blue{background:var(--blue);} .btn.pink{background:var(--pink-d);}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);}
  .btn:disabled{opacity:.4;cursor:default;}
  .chip-lock{display:inline-block;background:var(--blue-l);color:var(--blue-d);font-weight:700;padding:10px 14px;border-radius:10px;}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-row label{border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:14px;background:#fff;}
  .radio-row input{margin-right:6px;}
  .radio-row label.on{border-color:var(--blue);background:var(--blue-l);}
  .warn{background:var(--yellow-l);border:1px solid #F5C451;color:#7A5500;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:12px;}
  .err{background:var(--red-l);border:1px solid #F3A3A5;color:#9B1C1F;border-radius:12px;padding:12px 14px;font-size:13px;margin:10px 0;}
  .ok-box{background:var(--green-l);border:1px solid #9FDDBF;color:#0E6B45;border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0;}

  /* quiz */
  .phase-track{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .pill{font-family:'Jua',sans-serif;font-size:13px;padding:5px 13px;border-radius:999px;border:2px solid var(--line);color:var(--muted);}
  .pill.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pill.done{background:var(--green);border-color:var(--green);color:#fff;}
  .center{text-align:center;}
  .progress{font-size:13px;color:var(--pink-d);font-weight:700;margin-bottom:8px;}
  .big-hanzi{font-family:'Noto Sans SC',sans-serif;font-size:clamp(44px,10vw,74px);font-weight:700;margin:4px 0 0;}
  .big-pinyin{font-family:'Jua',sans-serif;font-size:21px;color:var(--pink-d);margin-bottom:18px;}
  .prompt-meaning{font-family:'Jua',sans-serif;font-size:26px;margin:6px 0 4px;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
  @media (max-width:520px){.options{grid-template-columns:1fr;}}
  .opt{font-family:inherit;font-size:16px;font-weight:500;padding:16px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px);}
  .opt.correct{background:var(--green);border-color:var(--green);color:#fff;}
  .opt.wrong{background:var(--red-l);border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .next{margin-top:18px;opacity:0;pointer-events:none;transition:opacity .2s;}
  .next.show{opacity:1;pointer-events:auto;}
  .play{width:104px;height:104px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:44px;cursor:pointer;
    box-shadow:0 8px 0 var(--blue-d);margin:6px auto 18px;display:block;transition:.1s;}
  .play:active{transform:translateY(4px);box-shadow:0 4px 0 var(--blue-d);}
  .peek{background:none;border:none;color:var(--blue);text-decoration:underline;font-size:13px;cursor:pointer;margin-bottom:12px;}
  .note{font-size:12px;color:var(--muted);margin-bottom:10px;}

  .slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:60px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin:12px 0;background:#F8FBFF;}
  .tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px;}
  .tile{font-family:'Jua',sans-serif;font-size:24px;padding:10px 18px;border-radius:12px;border:2px solid var(--blue);background:var(--blue-l);color:var(--blue-d);cursor:pointer;box-shadow:0 4px 0 var(--blue);}
  .tile.used{opacity:.25;pointer-events:none;box-shadow:none;}
  .tile.placed{background:var(--yellow-l);border-color:#F5C451;color:#7A5500;box-shadow:0 4px 0 #F5C451;}
  .tile.good{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 0 #0E6B45;}
  .tile.bad{background:var(--red-l);border-color:var(--red);color:#9B1C1F;box-shadow:0 4px 0 var(--red);}
  .fb{min-height:24px;font-family:'Jua',sans-serif;font-size:19px;margin-top:8px;}
  .fb.ok{color:var(--green);} .fb.no{color:var(--red);}

  .speed{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:6px;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .sc{border:2px solid var(--line);border-radius:14px;padding:12px 8px;background:#fff;cursor:pointer;text-align:center;min-height:68px;
      display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.12s;font-family:inherit;color:var(--ink);}
  .sc .h{font-family:'Noto Sans SC',sans-serif;font-size:24px;font-weight:700;}
  .sc .p{font-family:'Jua',sans-serif;font-size:14px;color:var(--pink-d);}
  .sc .m{font-size:15px;font-weight:500;}
  .sc.sel{border-color:var(--blue);background:var(--blue-l);transform:scale(1.03);}
  .sc.done{background:var(--green);border-color:var(--green);color:#fff;pointer-events:none;}
  .sc.done .p{color:#fff;}
  .sc.shake{animation:shake .35s;border-color:var(--red);background:var(--red-l);}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .finish h2{font-size:34px;color:var(--blue);}
  .score-big{font-family:'Jua',sans-serif;font-size:26px;margin:6px 0 4px;}
  .breakdown{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:14px 0;}
  .breakdown div{font-size:14px;text-align:center;color:var(--muted);}
  .breakdown b{display:block;font-family:'Jua',sans-serif;font-size:23px;color:var(--pink-d);font-weight:400;}
  .growth{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:10px 0;}
  .growth .g{background:var(--blue-l);border-radius:14px;padding:10px 16px;min-width:120px;}
  .growth .g b{display:block;font-family:'Jua',sans-serif;font-size:22px;color:var(--blue-d);font-weight:400;}

  /* tables */
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;margin-top:8px;}
  th{font-family:'Jua',sans-serif;font-weight:400;font-size:13px;text-align:left;padding:8px 8px;border-bottom:2px solid var(--line);color:var(--blue);white-space:nowrap;}
  td{padding:9px 8px;border-bottom:1px solid #EAF2F9;font-size:14px;vertical-align:middle;}
  tr.click{cursor:pointer;} tr.click:hover td{background:#F5FAFF;}
  .rk{font-family:'Jua',sans-serif;font-size:19px;width:46px;}
  .bar{background:#E8F0F8;border-radius:6px;height:10px;overflow:hidden;min-width:70px;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .b-up{background:var(--green-l);color:#0E6B45;} .b-down{background:var(--red-l);color:#9B1C1F;}
  .b-keep{background:var(--yellow-l);color:#7A5500;} .b-one{background:#EEF2F6;color:var(--muted);}
  .b-att{background:var(--red);color:#fff;}
  .sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .sub-tabs button{font-family:'Jua',sans-serif;font-size:15px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;}
  .sub-tabs button.on{background:var(--pink-d);border-color:var(--pink-d);color:#fff;}
  .detail td{background:#F8FBFF;font-size:13px;}
  .cell{display:inline-block;min-width:46px;text-align:center;border-radius:8px;padding:3px 6px;font-weight:700;font-size:13px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 14px;}
  .kpi{background:var(--blue-l);border-radius:14px;padding:12px 14px;}
  .kpi span{font-size:12px;color:var(--muted);} .kpi b{display:block;font-family:'Jua',sans-serif;font-size:24px;color:var(--blue-d);font-weight:400;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}
  .loading{text-align:center;padding:36px;color:var(--muted);font-family:'Jua',sans-serif;font-size:18px;}
  footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <svg viewBox="0 0 520 250" role="img" aria-label="분홍 지붕의 병원 건물과 체온계, 알약 일러스트">
      <g fill="#fff"><ellipse cx="70" cy="46" rx="36" ry="14"/><ellipse cx="98" cy="38" rx="24" ry="12"/><ellipse cx="444" cy="66" rx="40" ry="14"/><ellipse cx="472" cy="56" rx="22" ry="11"/></g>

      <rect x="150" y="86" width="220" height="142" rx="8" fill="#fff" stroke="#9DB8D6" stroke-width="3"/>

    </svg>
    <div class="eyebrow">중국어 단어 익히기 · 3과 · 병원 이야기</div>
    <h1>你哪儿不舒服?</h1>
    <div class="pinyin-title">Nǐ nǎr bù shūfu?</div>

<script>
/* ============ 설정 ============
   구글 앱스 스크립트 웹 앱 주소를 아래 따옴표 안에 붙여넣으세요.
   비워두면 '연습(데모) 모드'로 동작하며, 기록은 그 기기의 브라우저에만 저장됩니다. */
const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz2zU1wGAvo8f87embpTUWPAiMByucm--Xvalig35oBYIclg_XOq8puU8Ki0VB6PQaY/exec";
const DEMO_TEACHER_PW = "demo";   // 데모 모드에서만 쓰는 교사용 비밀번호

const ROUND_COUNT = 4;
const CLASSES = [
  {id:1,label:'1반'},{id:2,label:'2반'},{id:3,label:'5,6합반'},{id:4,label:'7반'},{id:5,label:'8반'}
];
const classLabel = id => (CLASSES.find(c=>c.id===Number(id))||{label:id+'반'}).label;
/* 반별 링크: 주소 뒤에 ?class=3 처럼 붙이면 그 반으로 고정됩니다 */
const LOCK_CLS = (()=>{ try{ const v=parseInt(new URLSearchParams(location.search).get('class'),10); return CLASSES.some(c=>c.id===v)?v:null; }catch(e){ return null; } })();

const PHASES = [
  {id:'listen',label:'🔊 듣고 뜻 고르기'},
  {id:'pieces',label:'🧩 병음 조각 맞추기'},
  {id:'speed', label:'⚡ 스피드 짝짓기'}
];

const VOCAB = {
  1: { title: "1회차 · 머리가 아파요", words: [
    {hanzi:"怎么", pinyin:"zěnme", meaning:"어째서, 어떻게", parts:["zěn","me"]},
    {hanzi:"了", pinyin:"le", meaning:"[상황의 출현을 나타냄]", parts:["l","e"], noTTS:true},
    {hanzi:"看起来", pinyin:"kàn qilai", meaning:"보기에", parts:["kàn","qi","lai"]},
    {hanzi:"脸色", pinyin:"liǎnsè", meaning:"안색", parts:["liǎn","sè"]},
    {hanzi:"不太", pinyin:"bú tài", meaning:"그다지 ~하지 않다", parts:["bú","tài"]},
    {hanzi:"有点儿", pinyin:"yǒudiǎnr", meaning:"조금, 약간", parts:["yǒu","diǎn","r"]},
    {hanzi:"头", pinyin:"tóu", meaning:"머리", parts:["t","óu"]},
    {hanzi:"疼", pinyin:"téng", meaning:"아프다", parts:["t","éng"]},
    {hanzi:"得", pinyin:"děi", meaning:"~해야 한다", parts:["d","ěi"], noTTS:true},
    {hanzi:"医院", pinyin:"yīyuàn", meaning:"병원", parts:["yī","yuàn"]},
    {hanzi:"看", pinyin:"kàn", meaning:"진찰 받다", parts:["k","àn"]},
    {hanzi:"陪", pinyin:"péi", meaning:"동반하다", parts:["p","éi"]},
    {hanzi:"不用", pinyin:"búyòng", meaning:"~할 필요가 없다", parts:["bú","yòng"]}
  ]},
  2: { title: "2회차 · 감기에 걸렸어요", words: [

/* ============ 저장소: 구글시트(앱스 스크립트) 또는 데모(브라우저) ============ */
const DEMO_KEY='l3_demo_rows_v1'; const memRows=[];
function demoRows(){ try{ const s=localStorage.getItem(DEMO_KEY); if(s) return JSON.parse(s); }catch(e){} return memRows; }
function demoSave(rows){ try{ localStorage.setItem(DEMO_KEY,JSON.stringify(rows)); }catch(e){ memRows.length=0; rows.forEach(r=>memRows.push(r)); } }
function demoApi(p){
  const rows=demoRows();
  if(p.action==='submit'){
    if(rows.some(r=>r.uid===p.uid)) return {status:'ok',attemptNo:rows.find(r=>r.uid===p.uid).attemptNo};
    const attemptNo=rows.filter(r=>String(r.cls)===String(p.cls)&&String(r.studentId)===String(p.studentId)&&Number(r.round)===Number(p.round)).length+1;
    rows.push({ts:Date.now(),cls:p.cls,studentId:String(p.studentId),name:p.name,round:p.round,roundTitle:p.roundTitle,attemptNo,
      phasesCompleted:p.phasesCompleted,phasesTotal:p.phasesTotal,p:p.p,totalScore:p.totalScore,totalMax:p.totalMax,uid:p.uid});
    demoSave(rows); return {status:'ok',attemptNo};
  }
  if(p.action==='class') return {status:'ok',rows:rows.filter(r=>String(r.cls)===String(p.cls))};
  if(p.action==='teacher') return p.pw===DEMO_TEACHER_PW ? {status:'ok',rows} : {status:'unauthorized'};
  return {status:'error',message:'unknown'};
}
async function api(payload){
  if(!SHEET_WEBHOOK_URL) return demoApi(payload);
  try{
    const res=await fetch(SHEET_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    return await res.json();
  }catch(e){ console.error('api error',e); return {status:'error',message:'network'}; }
}

function pillsHTML(){
  return `<div class="phase-track">${PHASES.map((p,i)=>`<div class="pill ${i<session.phaseIndex?'done':i===session.phaseIndex?'active':''}">${p.label}</div>`).join('')}</div>`;

const whoLine = () => `${esc(session.title)} · ${classLabel(session.cls)} ${esc(session.studentId)} ${esc(session.name)}님`;
function runPhase(){ const id=PHASES[session.phaseIndex].id; if(id==='listen') initListen(); else if(id==='pieces') initPieces(); else initSpeed(); }
function phaseDone(score){
  session.phaseScores.push(score);
  if(session.phaseIndex===PHASES.length-1) finishQuiz(); else renderInterstitial();

/* --- 1단계: 듣고 뜻 고르기 --- */
let L=null;
function speak(w){
  if(!SPEECH_OK) return;
  try{
    const u=new SpeechSynthesisUtterance(w.say||w.hanzi); u.lang='zh-CN'; u.rate=0.8;
    const v=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function initListen(){ L={order:shuffle(session.words.map((_,i)=>i)),i:0,score:0,peek:false}; renderListen(); }
function renderListen(){
  if(L.i>=L.order.length){ phaseDone(L.score); return; }
  const w=session.words[L.order[L.i]];
  const audio=session.listenAudio && !w.noTTS;
  const pool=session.words.map(x=>x.meaning).filter(m=>m!==w.meaning);
  const options=shuffle([w.meaning,...shuffle(pool).slice(0,3)]);
  L.peek=false;
  $('stage-quiz').innerHTML=`
    <div class="panel card center">
      ${pillsHTML()}
      <div class="progress">${whoLine()} · ${L.i+1}/${L.order.length}</div>
      <div id="prompt">${audio
        ? `<button class="play" id="play-btn" aria-label="발음 듣기">🔊</button><div class="note">버튼을 눌러 다시 들을 수 있어요</div><button class="peek" id="peek-btn">글자로 보기</button>`
        : `<div class="big-hanzi">${esc(w.hanzi)}</div><div class="big-pinyin">${esc(w.pinyin)}</div>${session.listenAudio?'<div class="note">이 단어는 발음이 정확하지 않을 수 있어 글자로 나와요</div>':''}`}</div>
      <div class="options">${options.map(o=>`<button class="opt" data-v="${encodeURIComponent(o)}">${esc(o)}</button>`).join('')}</div>
      <button class="btn blue next" id="next-btn">다음 →</button>
    </div>`;
  if(audio){
    $('play-btn').addEventListener('click',()=>speak(w));
    $('peek-btn').addEventListener('click',()=>{ $('prompt').innerHTML=`<div class="big-hanzi">${esc(w.hanzi)}</div><div class="big-pinyin">${esc(w.pinyin)}</div>`; });
    setTimeout(()=>speak(w),300);
  }
  document.querySelectorAll('#stage-quiz .opt').forEach(b=>b.addEventListener('click',()=>{
    const v=decodeURIComponent(b.dataset.v);
    document.querySelectorAll('#stage-quiz .opt').forEach(x=>{ x.disabled=true; if(decodeURIComponent(x.dataset.v)===w.meaning) x.classList.add('correct'); });
    if(v===w.meaning) L.score++; else b.classList.add('wrong');
    $('next-btn').classList.add('show');
  }));
  $('next-btn').addEventListener('click',()=>{ L.i++; renderListen(); });
}

/* --- 2단계: 병음 조각 맞추기 --- */
let P=null;
function initPieces(){ P={order:shuffle(session.words.map((_,i)=>i)),i:0,score:0}; renderPieces(); }
function renderPieces(){
  if(P.i>=P.order.length){ phaseDone(P.score); return; }
  const w=session.words[P.order[P.i]];
  let tiles=w.parts.map((t,k)=>({k,t}));
  for(let n=0;n<12;n++){ const s=shuffle(tiles); if(s.map(x=>x.t).join('|')!==w.parts.join('|')){ tiles=s; break; } }
  let ans=[]; let locked=false;
  $('stage-quiz').innerHTML=`
    <div class="panel card center">
      ${pillsHTML()}
      <div class="progress">${whoLine()} · ${P.i+1}/${P.order.length}</div>
      <div class="prompt-meaning">${esc(w.meaning)}</div>
      <div class="big-hanzi" style="font-size:clamp(40px,9vw,60px)">${esc(w.hanzi)}</div>
      <div class="note">조각을 눌러 순서대로 병음을 완성해요 (눌러서 다시 뺄 수도 있어요)</div>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <div class="fb" id="fb"></div>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn ghost" id="clear-btn">지우기</button>
        <button class="btn blue" id="check-btn" disabled>확인</button>
        <button class="btn blue next" id="next-btn">다음 →</button>
      </div>
    </div>`;
  const draw=()=>{
    $('slots').innerHTML=ans.length?ans.map((id,pos)=>`<button class="tile placed" data-pos="${pos}">${esc(tiles.find(t=>t.k===id).t)}</button>`).join(''):'<span class="muted" style="align-self:center">여기에 조각이 쌓여요</span>';
    $('tiles').innerHTML=tiles.map(t=>`<button class="tile ${ans.includes(t.k)?'used':''}" data-k="${t.k}">${esc(t.t)}</button>`).join('');
    $('check-btn').disabled=locked||ans.length!==tiles.length;
    document.querySelectorAll('#tiles .tile').forEach(b=>b.addEventListener('click',()=>{ if(locked) return; ans.push(Number(b.dataset.k)); draw(); }));
    document.querySelectorAll('#slots .tile').forEach(b=>b.addEventListener('click',()=>{ if(locked) return; ans.splice(Number(b.dataset.pos),1); draw(); }));
  };
  draw();
  $('clear-btn').addEventListener('click',()=>{ if(locked) return; ans=[]; draw(); });
  $('check-btn').addEventListener('click',()=>{
    locked=true;
    const got=ans.map(id=>tiles.find(t=>t.k===id).t), ok=got.join('|')===w.parts.join('|');
    document.querySelectorAll('#slots .tile').forEach(b=>{ b.classList.remove('placed'); b.classList.add(ok?'good':'bad'); });
    $('fb').className='fb '+(ok?'ok':'no');
    $('fb').textContent=ok?'정답이에요! 👏':`아쉬워요! 정답은 ${w.pinyin} 예요.`;
    if(ok) P.score++;
    $('check-btn').disabled=true; $('clear-btn').disabled=true; $('next-btn').classList.add('show');
  });
  $('next-btn').addEventListener('click',()=>{ P.i++; renderPieces(); });
}

/* --- 3단계: 스피드 짝짓기 --- */
let S=null;
function initSpeed(){
  const idx=shuffle(session.words.map((_,i)=>i)); const chunks=[];
  for(let i=0;i<idx.length;i+=4) chunks.push(idx.slice(i,i+4));
  if(chunks.length>1 && chunks[chunks.length-1].length===1){ const last=chunks.pop(); chunks[chunks.length-1].push(last[0]); }
  S={chunks,c:0,missed:new Set()}; renderSpeed();
}
function renderSpeed(){
  if(S.c>=S.chunks.length){ phaseDone(session.wordCount-S.missed.size); return; }
  const ids=S.chunks[S.c]; const left=shuffle(ids), right=shuffle(ids);
  let selL=null, selR=null, matched=0, busy=false;
  $('stage-quiz').innerHTML=`
    <div class="panel card center">
      ${pillsHTML()}
      <div class="progress">${whoLine()} · 묶음 ${S.c+1}/${S.chunks.length}</div>
      <div class="note">한자 카드와 뜻 카드를 하나씩 눌러 짝을 지어요. 틀리면 그 단어는 점수를 받지 못해요.</div>
      <div class="speed">
        <div class="col">${left.map(i=>`<button class="sc" data-l="${i}"><span class="h">${esc(session.words[i].hanzi)}</span><span class="p">${esc(session.words[i].pinyin)}</span></button>`).join('')}</div>
        <div class="col">${right.map(i=>`<button class="sc" data-r="${i}"><span class="m">${esc(session.words[i].meaning)}</span></button>`).join('')}</div>
      </div>
    </div>`;
  const cards=()=>[...document.querySelectorAll('#stage-quiz .sc')];
  function evaluate(){
    busy=true;
    const a=document.querySelector(`.sc[data-l="${selL}"]`), b=document.querySelector(`.sc[data-r="${selR}"]`);
    if(selL===selR){
      a.classList.remove('sel'); b.classList.remove('sel'); a.classList.add('done'); b.classList.add('done'); matched++;
      selL=selR=null; busy=false;
      if(matched===ids.length) setTimeout(()=>{ S.c++; renderSpeed(); },650);
    } else {
      S.missed.add(selL); a.classList.add('shake'); b.classList.add('shake');
      setTimeout(()=>{ a.classList.remove('shake','sel'); b.classList.remove('shake','sel'); selL=selR=null; busy=false; },420);
    }
  }
  cards().forEach(c=>c.addEventListener('click',()=>{
    if(busy||c.classList.contains('done')) return;
    if(c.dataset.l!==undefined){ cards().filter(x=>x.dataset.l!==undefined).forEach(x=>x.classList.remove('sel')); selL=Number(c.dataset.l); c.classList.add('sel'); }
    else { cards().filter(x=>x.dataset.r!==undefined).forEach(x=>x.classList.remove('sel')); selR=Number(c.dataset.r); c.classList.add('sel'); }
    if(selL!==null && selR!==null) evaluate();
  }));
}

/* --- 제출 + 성장 안내 --- */
async function finishQuiz(){
  const st=session; const el=$('stage-quiz');
  el.innerHTML=`<div class="panel"><div class="loading">점수를 저장하는 중...</div></div>`;
  const done=st.phaseScores.length;
  const totalScore=st.phaseScores.reduce((a,b)=>a+b,0), totalMax=done*st.wordCount;
  const payload={action:'submit',uid:st.uid,cls:st.cls,studentId:st.studentId,name:st.name,round:st.round,roundTitle:st.title,
    phasesCompleted:done,phasesTotal:PHASES.length,p:[0,1,2].map(i=>st.phaseScores[i]==null?null:st.phaseScores[i]),totalScore,totalMax};
  const res=await api(payload);
  const ok=res&&res.status==='ok';
  let growthHTML='';
  if(ok){

      <div class="row" style="justify-content:center;margin-top:12px">

    </div>`;
  if(!ok) $('retry-save').addEventListener('click',finishQuiz);

/* ============ 공통 계산 ============ */
function bestMap(rows){
  const m=new Map(), cnt=new Map();
  rows.forEach(r=>{
    const k=r.cls+'|'+r.studentId+'|'+r.round; cnt.set(k,(cnt.get(k)||0)+1);
    const c=m.get(k); if(!c||r.totalScore>c.totalScore||(r.totalScore===c.totalScore&&r.ts<c.ts)) m.set(k,r);
  });
  return {best:m,cnt};
}
function rankRows(rows,view){
  const {best,cnt}=bestMap(rows);
  if(view==='all'){
    const per=new Map();
    best.forEach((r,k)=>{
      const sk=r.cls+'|'+r.studentId; if(!per.has(sk)) per.set(sk,{cls:r.cls,studentId:r.studentId,name:r.name,score:0,max:0,rounds:0,tries:0,ts:0});
      const p=per.get(sk); p.score+=r.totalScore; p.max+=r.totalMax; p.rounds++; p.tries+=cnt.get(k); if(r.ts>=p.ts){p.ts=r.ts;p.name=r.name;}
    });
    return [...per.values()].sort((a,b)=>b.score-a.score||b.rounds-a.rounds||(a.max?b.score/b.max-a.score/a.max:0));
  }
  const out=[]; best.forEach((r,k)=>{ if(Number(r.round)===Number(view)) out.push({cls:r.cls,studentId:r.studentId,name:r.name,score:r.totalScore,max:r.totalMax,phases:r.phasesCompleted,phasesTotal:r.phasesTotal,tries:cnt.get(k),ts:r.ts}); });
  return out.sort((a,b)=>b.score-a.score||a.ts-b.ts);
}
function rankTable(list,view,withClass){
  if(!list.length) return `<p class="muted">아직 저장된 기록이 없어요.</p>`;
  const mx=Math.max(...list.map(l=>l.score),1);
  return `<div class="tbl-wrap"><table><thead><tr><th>순위</th>${withClass?'<th>반</th>':''}<th>학번</th><th>이름</th><th>점수</th><th>${view==='all'?'참여 회차':'완료 단계'}</th><th>도전</th><th style="width:22%">달성</th></tr></thead><tbody>
    ${list.map((l,i)=>`<tr><td class="rk">${medal(i)}</td>${withClass?`<td>${classLabel(l.cls)}</td>`:''}<td>${esc(l.studentId)}</td><td><b>${esc(l.name)}</b></td>
      <td>${l.score} / ${l.max}</td><td>${view==='all'?l.rounds+'회차':l.phases+'/'+l.phasesTotal}</td><td>${l.tries}회</td>
      <td><div class="bar"><i style="width:${(l.score/mx*100).toFixed(0)}%"></i></div></td></tr>`).join('')}</tbody></table></div>`;
}

function groupAttempts(rows){
  const g=new Map();
  rows.forEach(r=>{ const k=r.cls+'|'+r.studentId+'|'+r.round; if(!g.has(k)) g.set(k,[]); g.get(k).push(r); });
  g.forEach(a=>a.sort((x,y)=>x.ts-y.ts));
  return g;
}
/* 성장 비교는 '같은 단계'끼리만: 1단계만 푼 시도와 3단계까지 푼 시도를 그대로 비교하면 왜곡되기 때문 */
function accOver(r,k){
  const wc=r.phasesCompleted?r.totalMax/r.phasesCompleted:0;
  if(!wc||!Array.isArray(r.p)) return pct(r);
  let s=0; for(let i=0;i<k;i++){ const v=r.p[i]; if(v==null) return pct(r); s+=Number(v); }
  return Math.round(s/(k*wc)*1000)/10;
}
function statOf(att){
  const k=Math.max(1,Math.min(...att.map(a=>a.phasesCompleted||1)));
  const ps=att.map(a=>accOver(a,k)), n=att.length, first=ps[0], last=ps[n-1], best=Math.max(...ps), delta=Math.round((last-first)*10)/10;
  let st; if(n<2) st={k:'one',label:'첫 도전',cls:'b-one'}; else if(delta>=10) st={k:'up',label:'📈 향상',cls:'b-up'}; else if(delta<=-10) st={k:'down',label:'📉 하락',cls:'b-down'}; else st={k:'keep',label:'➖ 유지',cls:'b-keep'};
  const attention = st.k==='down' || best<60;
  return {n,k,first,last,best,delta,st,attention,ps};
}
function spark(ps){
  const w=96,h=30,pad=4; if(!ps.length) return '';
  const x=i=>ps.length===1?w/2:pad+i*(w-2*pad)/(ps.length-1), y=v=>h-pad-(v/100)*(h-2*pad);
  const pts=ps.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const col=ps.length>1&&ps[ps.length-1]>=ps[0]?'#16A36A':'#E5484D';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="시도별 정답률 추이"><line x1="0" y1="${y(60)}" x2="${w}" y2="${y(60)}" stroke="#E1EAF3" stroke-dasharray="3 3"/>
    ${ps.length>1?`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${ps.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===ps.length-1?3.6:2.6}" fill="${i===ps.length-1?col:'#fff'}" stroke="${col}" stroke-width="1.6"/>`).join('')}</svg>`;
}
function heat(v){ if(v==null) return `<span class="cell" style="background:#F1F5F9;color:#94A3B8">-</span>`;
  const bg=v>=85?'#DCF5E8':v>=60?'#FFF4D1':'#FFE3E3', fg=v>=85?'#0E6B45':v>=60?'#7A5500':'#9B1C1F';
  return `<span class="cell" style="background:${bg};color:${fg}">${v}%</span>`; }

function drawGrowthRound(body,rows,round){

    <div class="tbl-wrap"><table><thead><tr><th>반</th><th>학번</th><th>이름</th><th>시도</th><th>추이</th><th>첫 → 마지막</th><th>향상폭</th><th>최고</th><th>상태</th></tr></thead><tbody>
    ${list.map((x,i)=>`<tr class="click" data-i="${i}"><td>${classLabel(x.r.cls)}</td><td>${esc(x.r.studentId)}</td><td><b>${esc(x.r.name)}</b></td><td>${x.s.n}회${x.s.n>=2?`<br><span class="muted">${x.s.k}단계 기준</span>`:''}</td><td>${spark(x.s.ps)}</td>
      <td>${x.s.n<2?'-':x.s.first+'% → '+x.s.last+'%'}</td><td>${x.s.n<2?'-':`<b style="color:${x.s.delta>=0?'#0E6B45':'#9B1C1F'}">${x.s.delta>0?'+':''}${x.s.delta}%p</b>`}</td><td>${x.s.best}%</td>

function drawGrowthAll(body,rows){
  const g=groupAttempts(rows); const per=new Map();
  g.forEach((att,k)=>{ const r=att[att.length-1]; const sk=r.cls+'|'+r.studentId; if(!per.has(sk)) per.set(sk,{cls:r.cls,studentId:r.studentId,name:r.name,rounds:{},deltas:[],tries:0});
    const p=per.get(sk), s=statOf(att); p.rounds[r.round]={best:s.best,n:s.n}; p.tries+=s.n; if(s.n>=2) p.deltas.push(s.delta); p.name=r.name; });
  const list=[...per.values()].sort((a,b)=>String(a.studentId).localeCompare(String(b.studentId),'ko',{numeric:true}));
  body.innerHTML=`<p class="muted">회차별 <b>최고 정답률</b>입니다. 재도전 향상폭은 같은 회차를 2번 이상 푼 경우의 (마지막−첫 시도) 평균이에요. 한 회차의 상세 성장은 위에서 회차를 선택하세요.</p>
    <div class="tbl-wrap"><table><thead><tr><th>반</th><th>학번</th><th>이름</th>${Array.from({length:ROUND_COUNT},(_,i)=>`<th>${i+1}회차</th>`).join('')}<th>평균 최고</th><th>총 도전</th><th>재도전 향상폭</th></tr></thead><tbody>
    ${list.map(p=>{ const bs=Object.values(p.rounds).map(x=>x.best), avg=bs.length?Math.round(bs.reduce((a,b)=>a+b,0)/bs.length*10)/10:null;
      const d=p.deltas.length?Math.round(p.deltas.reduce((a,b)=>a+b,0)/p.deltas.length*10)/10:null;
      return `<tr><td>${classLabel(p.cls)}</td><td>${esc(p.studentId)}</td><td><b>${esc(p.name)}</b></td>
        ${Array.from({length:ROUND_COUNT},(_,i)=>{ const x=p.rounds[i+1]; return `<td>${heat(x?x.best:null)}${x&&x.n>1?` <span class="muted">×${x.n}</span>`:''}</td>`; }).join('')}
        <td>${avg==null?'-':avg+'%'}</td><td>${p.tries}회</td><td>${d==null?'-':`<b style="color:${d>=0?'#0E6B45':'#9B1C1F'}">${d>0?'+':''}${d}%p</b>`}</td></tr>`; }).join('')}
    </tbody></table></div>`;
}

function drawSummary(body){
  const cards=CLASSES.map(c=>{
    const rows=T.rows.filter(r=>Number(r.cls)===c.id); if(!rows.length) return `<tr><td><b>${c.label}</b></td><td colspan="6" class="muted">기록 없음</td></tr>`;
    const g=groupAttempts(rows), stats=[...g.values()].map(statOf), students=new Set(rows.map(r=>r.studentId));
    const multi=stats.filter(s=>s.n>=2), avgBest=Math.round(stats.reduce((a,s)=>a+s.best,0)/stats.length*10)/10;
    const avgGain=multi.length?Math.round(multi.reduce((a,s)=>a+s.delta,0)/multi.length*10)/10:null;
    return `<tr><td><b>${c.label}</b></td><td>${students.size}명</td><td>${rows.length}회</td><td>${avgBest}%</td><td>${Math.round(multi.length/stats.length*100)}%</td>
      <td>${avgGain==null?'-':`<b style="color:${avgGain>=0?'#0E6B45':'#9B1C1F'}">${avgGain>0?'+':''}${avgGain}%p</b>`}</td><td>${stats.filter(s=>s.attention).length}건</td></tr>`;
  }).join('');
  const rounds=Array.from({length:ROUND_COUNT},(_,i)=>i+1);
  const part=CLASSES.map(c=>`<tr><td><b>${c.label}</b></td>${rounds.map(n=>{ const ids=new Set(T.rows.filter(r=>Number(r.cls)===c.id&&Number(r.round)===n).map(r=>r.studentId)); return `<td>${ids.size?ids.size+'명':'<span class="muted">-</span>'}</td>`; }).join('')}</tr>`).join('');
  body.innerHTML=`<h3 style="font-family:Jua;font-weight:400;margin:6px 0">학급별 학습 현황</h3>
    <div class="tbl-wrap"><table><thead><tr><th>학급</th><th>참여 학생</th><th>총 시도</th><th>평균 최고 정답률</th><th>재도전 비율</th><th>재도전 평균 향상폭</th><th>관찰 필요</th></tr></thead><tbody>${cards}</tbody></table></div>
    <h3 style="font-family:Jua;font-weight:400;margin:18px 0 6px">회차별 참여 학생 수</h3>
    <div class="tbl-wrap"><table><thead><tr><th>학급</th>${rounds.map(n=>`<th>${n}회차</th>`).join('')}</tr></thead><tbody>${part}</tbody></table></div>
    <p class="muted">✽ 관찰 필요 = 같은 회차에서 첫 시도보다 10%p 이상 떨어졌거나 최고 정답률이 60% 미만인 경우입니다. 학생에게 알리는 용도가 아니라 지도 참고용이에요.</p>`;
}

function drawExport(body){
  body.innerHTML=`<p class="muted">모든 시도(첫 도전부터 마지막 도전까지)를 CSV로 내려받아 엑셀·구글시트에서 직접 분석할 수 있어요. 구글시트를 연동했다면 시트 자체가 같은 원본 기록입니다.</p>
    <div class="row"><button class="btn blue" id="csv-btn">CSV 내려받기 (전체 시도)</button></div>`;
  $('csv-btn').addEventListener('click',()=>{
    const head=['기록시각','반','학번','이름','회차','시도차수','완료단계','듣고뜻','병음조각','스피드짝','총점','만점','정답률(%)'];
    const lines=[head].concat(T.rows.slice().sort((a,b)=>a.ts-b.ts).map(r=>[new Date(r.ts).toLocaleString('ko-KR'),classLabel(r.cls),r.studentId,r.name,r.round,r.attemptNo,r.phasesCompleted,
      r.p&&r.p[0]!=null?r.p[0]:'',r.p&&r.p[1]!=null?r.p[1]:'',r.p&&r.p[2]!=null?r.p[2]:'',r.totalScore,r.totalMax,pct(r)]));
    const csv=lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'})); a.download='3과_단어퀴즈_전체시도.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
}

/* 데모 모드 전용: 대시보드 미리보기용 가상 데이터 */
function seedDemo(){
  const names=['가온','나래','다온','라온','마루','보라','새봄','아름','여름','하늘','구름','바다'];
  const rows=[]; let t=Date.now()-7*86400000;
  names.forEach((nm,i)=>{
    const cls=CLASSES[i%CLASSES.length].id, sid=String(10100+i*3+(i%CLASSES.length)*100);
    for(let round=1;round<=2;round++){
      const tries=1+((i+round)%4); let base=35+((i*13)%35);
      for(let k=0;k<tries;k++){
        const trend=(i%5===3)?-6:12; base=Math.max(20,Math.min(100,base+trend+((k*7+i)%5)-2));
        const phases=1+((i+k)%3), wc=VOCAB[round].words.length;
        const p=[0,1,2].map(ph=>ph<phases?Math.round(wc*Math.min(100,Math.max(0,base+((ph*5+k)%7)-3))/100):null);
        const score=p.reduce((a,v)=>a+(v||0),0);
        t+=3600000*(3+(i+k)%7);
        rows.push({ts:t,cls,studentId:sid,name:'예시'+nm,round,roundTitle:VOCAB[round].title,attemptNo:k+1,phasesCompleted:phases,phasesTotal:3,
          p,totalScore:score,totalMax:phases*wc,uid:'seed'+i+round+k});
      }
    }
  });
  demoSave(rows);
}
